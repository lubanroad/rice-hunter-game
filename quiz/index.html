function show(id) { ['start', 'quiz', 'result'].forEach(s => $(s).classList.toggle('hidden', s !== id)); window.scrollTo(0, 0); }

// ===== 測驗流程 =====
let step = 0, sign = null, scores = {}, wantsTeam = false, result = null;

function resetQuiz() { step = 0; sign = null; scores = {}; wantsTeam = false; result = null; }

function renderQ() {
  const q = QUESTIONS[step];
  $('bar').style.width = (step / QUESTIONS.length * 100) + '%';
  $('qno').textContent = 'Q' + (step + 1) + ' / ' + QUESTIONS.length;
  $('qtitle').textContent = q.t;
  const box = $('opts');
  box.innerHTML = '';
  box.className = 'opts' + (q.sign ? ' grid3' : '');
  if (q.sign) {
    SIGNS.forEach((s, i) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = s.n + '<small>' + s.d + '</small>';
      b.onclick = () => { sign = i; next(); };
      box.appendChild(b);
    });
  } else {
    q.o.forEach(([label, pts], idx) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.textContent = label;
      b.onclick = () => {
        Object.entries(pts).forEach(([k, v]) => { scores[k] = (scores[k] || 0) + v; });
        if (q.teamIdx && q.teamIdx.includes(idx)) wantsTeam = true;
        next();
      };
      box.appendChild(b);
    });
  }
}

function next() {
  step++;
  if (step < QUESTIONS.length) renderQ(); else finish();
}

function finish() {
  let best = ORDER[0], bestScore = -1;
  ORDER.forEach(k => { const s = scores[k] || 0; if (s > bestScore) { best = k; bestScore = s; } });
  const t = twDate();
  const s = SIGNS[sign];
  const idx = (t.doy + sign * 3) % 7;
  result = {
    persona: best, sign: s.k, signName: s.n,
    horo: HORO[s.k][idx],
    side: LUCKY_SIDES[(t.doy + sign) % LUCKY_SIDES.length],
    color: LUCKY_COLORS[(t.doy * 2 + sign) % LUCKY_COLORS.length],
    team: wantsTeam || best === 'team',
  };
  renderResult();
  track('quiz_complete', { persona: best, sign: s.k });
}

function renderResult() {
  const p = PERSONAS[result.persona];
  $('rEmoji').textContent = p.e;
  $('rName').textContent = p.n;
  $('rDesc').textContent = p.d;
  $('rDishes').innerHTML = '';
  p.dishes.forEach(d => { const div = document.createElement('div'); div.className = 'dish'; div.textContent = '🍱 ' + d; $('rDishes').appendChild(div); });
  $('horoTitle').textContent = result.signName + '｜今日運勢';
  $('rHoro').textContent = result.horo;
  $('rLucky').innerHTML = '';
  ['幸運配菜：' + result.side, '幸運色：' + result.color].forEach(x => { const c = document.createElement('span'); c.className = 'chip'; c.textContent = x; $('rLucky').appendChild(c); });
  $('teamBtn').classList.toggle('hidden', !result.team);
  $('couponCode').textContent = '—';
  setNote('');
  $('claimBtn').classList.remove('hidden');
  show('result');
}

function setNote(text, ok) { const n = $('couponNote'); n.textContent = text; n.className = 'note' + (ok ? ' ok' : ''); }

// ===== LINE 登入與領券 =====
let liffInited = false;
async function initLiff() {
  try {
    await liff.init({ liffId: CONFIG.LIFF_ID });
    liffInited = true;
    if (liff.isLoggedIn()) resumePending();
  } catch (e) { console.warn('LIFF 初始化失敗', e); }
}
function resumePending() {
  let p = null;
  try { p = JSON.parse(sessionStorage.getItem('pendingQuiz') || 'null'); } catch (e) {}
  try { sessionStorage.removeItem('pendingQuiz'); } catch (e) {}
  if (!p || Date.now() - p.ts > 15 * 60 * 1000 || p.ymd !== twDate().ymd) return;
  result = p.result;
  renderResult();
  claim();
}

async function claim() {
  if (!result) return;
  if (!liffInited) { $('couponCode').textContent = '暫時無法領取'; setNote('LINE 登入元件載入失敗，請重新整理頁面再試'); return; }
  if (!liff.isLoggedIn()) {
    try { sessionStorage.setItem('pendingQuiz', JSON.stringify({ ts: Date.now(), ymd: twDate().ymd, result })); } catch (e) {}
    $('couponCode').textContent = '前往登入…';
    setNote('領券需要 LINE 登入，登入後會自動把折價券傳到你的 LINE');
    setTimeout(() => liff.login({ redirectUri: location.href.split('#')[0] }), 1200);
    return;
  }
  $('claimBtn').disabled = true;
  $('couponCode').textContent = '領取中…';
  try {
    const r = await fetch(CONFIG.API_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idToken: liff.getIDToken(), source: 'quiz', persona: result.persona, personaName: PERSONAS[result.persona].n, sign: result.sign }),
    });
    const data = await r.json().catch(() => ({}));
    if (r.ok && data.status === 'ok') {
      $('couponCode').textContent = data.code;
      setNote('✅ 折價券已傳送至你的 LINE，結帳時輸入折扣碼即可使用', true);
      $('claimBtn').classList.add('hidden');
      track('coupon_claim', { source: 'quiz', persona: result.persona });
    } else if (data.status === 'already_claimed') {
      $('couponCode').textContent = '今日已領取';
      setNote('每人每天限領一張（與粒粒獵人合併計算），今天的券已在你的 LINE 裡，明天再來！');
      $('claimBtn').classList.add('hidden');
    } else if (data.status === 'invalid_token') {
      $('couponCode').textContent = '請重新登入';
      setNote('登入逾時，請重新整理頁面後再領一次');
    } else {
      $('couponCode').textContent = '暫時無法領取';
      setNote('系統忙碌中，請稍後再試，或私訊知己知米 LINE 官方帳號');
    }
  } catch (e) {
    $('couponCode').textContent = '暫時無法領取';
    setNote('網路連線不穩，請稍後再試');
  } finally { $('claimBtn').disabled = false; }
}

function openUrl(url) {
  if (liffInited && liff.isInClient()) liff.openWindow({ url, external: false });
  else window.open(url, '_blank');
}

// ===== 分享圖卡（1080×1920）=====
function wrapText(ctx, text, x, y, maxW, lh) {
  let line = '';
  for (const ch of text) {
    if (ctx.measureText(line + ch).width > maxW && !'，。！？、；：）」'.includes(ch)) { ctx.fillText(line, x, y); line = ch; y += lh; }
    else line += ch;
  }
  if (line) ctx.fillText(line, x, y);
  return y + lh;
}
function makeShareImage() {
  const p = PERSONAS[result.persona];
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1920;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 1920); g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#f5ead2');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1920);
  ctx.strokeStyle = '#b8892a'; ctx.lineWidth = 6; ctx.strokeRect(60, 60, 960, 1800);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#b8892a'; ctx.font = '40px sans-serif'; ctx.fillText('RICEANDME｜知己知米', 540, 190);
  ctx.fillStyle = '#8a6418'; ctx.font = 'bold 76px sans-serif'; ctx.fillText('我的今日便當人格', 540, 320);
  ctx.font = '200px sans-serif'; ctx.fillText(p.e, 540, 600);
  ctx.fillStyle = '#3a3226'; ctx.font = 'bold 110px sans-serif'; ctx.fillText(p.n, 540, 780);
  ctx.textAlign = 'left'; ctx.font = '46px sans-serif'; ctx.fillStyle = '#3a3226';
  let y = wrapText(ctx, p.d, 150, 900, 780, 70);
  ctx.fillStyle = '#b8892a'; ctx.font = 'bold 44px sans-serif'; ctx.fillText('🍱 今日推薦', 150, y + 40);
  ctx.fillStyle = '#3a3226'; ctx.font = '46px sans-serif';
  y += 120; p.dishes.forEach(d => { y = wrapText(ctx, '・' + d, 150, y, 780, 64); });
  ctx.fillStyle = '#b8892a'; ctx.font = 'bold 44px sans-serif'; ctx.fillText('🔮 ' + result.signName + '今日運勢', 150, y + 40);
  ctx.fillStyle = '#3a3226'; ctx.font = '44px sans-serif';
  y = wrapText(ctx, result.horo, 150, y + 120, 780, 64);
  ctx.textAlign = 'center'; ctx.fillStyle = '#8c8170'; ctx.font = '38px sans-serif';
  ctx.fillText('測你的便當人格 → game.baofucompany.com/quiz', 540, 1760);
  return c;
}
async function share() {
  track('share_click', { persona: result.persona });
  const canvas = makeShareImage();
  const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
  const file = new File([blob], 'bento-persona.png', { type: 'image/png' });
  const text = '我的今日便當人格是「' + PERSONAS[result.persona].n + '」！你是哪一型？測完還送知己知米折價券 👉 ' + CONFIG.SITE_URL;
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], text }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  $('shareImg').src = URL.createObjectURL(blob);
  $('shareModal').classList.remove('hidden');
}

// ===== 綁定 =====
$('startBtn').onclick = () => { resetQuiz(); show('quiz'); renderQ(); track('quiz_start'); };
$('claimBtn').onclick = claim;
$('orderBtn').onclick = () => { track('order_click', { persona: result && result.persona }); openUrl(CONFIG.ORDER_URL); };
$('teamBtn').onclick = () => { track('team_click', { persona: result && result.persona }); openUrl(CONFIG.TEAM_URL); };
$('shareBtn').onclick = share;
$('againBtn').onclick = () => { resetQuiz(); show('start'); };
$('shareClose').onclick = () => $('shareModal').classList.add('hidden');
initLiff();
</script>
</body>
